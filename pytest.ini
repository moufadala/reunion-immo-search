[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
addopts = -ra --strict-markers -m "not browser and not live and not paid and not runtime" --ignore=tests/test_mapping_golden.py --ignore=tests/test_pipeline_invariants.py --ignore=tests/test_realestate_watch_source_gate.py
markers =
    browser: requires a browser runtime and is never part of the default suite
    live: reaches a live external service
    paid: can consume a paid provider quota
    runtime: requires VPS data or generated runtime artifacts
