server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        text/xml
        image/svg+xml;

    etag on;

    # P0 Privacy: saved_searches pages contain personal search criteria (name, budget,
    # family composition). Deny unconditionally — these must not be served publicly.
    location ~* ^/saved_searches {
        deny all;
    }

    # P1 Ops pages: expose internal pipeline state (source freshness, dedup rates).
    # Served but marked noindex so crawlers do not index them.
    location ~* ^/(ops|source_health|dedup) {
        add_header X-Robots-Tag "noindex,nofollow,noarchive" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }
}
