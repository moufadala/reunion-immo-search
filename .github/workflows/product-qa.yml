name: Product QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'reconcile/**', 'fix/**']

permissions:
  contents: read

jobs:
  product-qa:
    name: Immo product QA
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Public GitHub safety guard
        run: |
          python tests/audit_github_public_safety.py

      - name: Compile Python sources and tests
        run: |
          python -m compileall -q src scripts tests

      - name: Behavior tests (pytest)
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q \
            tests/test_leboncoin_apify_mapping.py \
            tests/test_identity_dedup.py \
            tests/test_normalize_db_commune_detection.py \
            tests/test_enrich_source_details_v3.py \
            tests/test_listing_contracts.py \
            tests/test_source_health_coverage.py \
            tests/test_realestate_source_gate_portable.py \
            tests/test_pipeline_coverage_gate_contract.py

      - name: Frontend dependency audit and build
        working-directory: webapp
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Source/pipeline contract audits
        run: |
          python tests/audit_pipeline_script_contracts.py
          python tests/audit_qa_readonly_defaults.py
          python tests/audit_search_alerts.py
          python tests/audit_private_profiles.py
