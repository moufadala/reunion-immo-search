name: Product QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'reconcile/**']

permissions:
  contents: read

jobs:
  product-qa:
    name: Immo product QA
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validate JSON artifacts
        run: |
          python -m json.tool artifacts/app/listings.json >/dev/null
          python -m json.tool artifacts/app/changes.json >/dev/null
          python -m json.tool artifacts/app/source_health.json >/dev/null
          python -m json.tool artifacts/app/opportunity.json >/dev/null
          python -m json.tool artifacts/app/locations.json >/dev/null
          python -m json.tool artifacts/app/build_manifest.json >/dev/null

      - name: Check public contact redaction
        run: |
          python scripts/sanitize_public_contacts.py --check \
            artifacts/app/listings.json \
            artifacts/app/changes.json \
            artifacts/app/changes.html \
            artifacts/app/veille.html

      - name: Run local static app server
        run: |
          python -m http.server 38627 --directory artifacts/app > /tmp/immo-http.log 2>&1 &
          echo $! > /tmp/immo-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:38627/listings.json >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/immo-http.log || true
          exit 1

      - name: Run product quality matrix
        env:
          IMMO_PUBLIC_BASE: http://127.0.0.1:38627
          IMMO_PUBLIC_URL: http://127.0.0.1:38627/
        run: |
          mkdir -p /tmp/immo-qa-ci
          python tests/run_product_quality_matrix.py \
            --public http://127.0.0.1:38627/ \
            --json-out /tmp/immo-qa-ci/latest.json \
            --md-out /tmp/immo-qa-ci/latest.md

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immo-product-qa-report
          path: |
            /tmp/immo-qa-ci/latest.json
            /tmp/immo-qa-ci/latest.md
            /tmp/immo-http.log
          if-no-files-found: ignore
